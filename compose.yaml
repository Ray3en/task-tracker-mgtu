services:
  frontend:
    # Docker Compose собирает образ по Dockerfile из текущей папки.
    build: .
    # Порт 8080 компьютера или сервера направляется в порт 80 контейнера.
    ports:
      - "80:80"
    # Docker перезапустит контейнер после сбоя или перезагрузки сервера.
    restart: unless-stopped
