server {
    # Nginx принимает HTTP-запросы на порту 80.
    listen 80;
    # Конфиг подходит для localhost, IP-адреса и любого домена.
    server_name _;
    # В эту папку Dockerfile копирует содержимое dist.
    root /usr/share/nginx/html;
    index index.html;
    location / {
        # Сначала ищем реальный файл или папку.
        # Если их нет, возвращаем index.html для React Router.
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        # Файлы Vite имеют hash в имени и могут долго храниться в кеше.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
