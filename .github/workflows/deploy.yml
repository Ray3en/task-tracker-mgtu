name: Deploy

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    # Обычная Environment variable, не secret.
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}

    steps:
      # Скачиваем commit, который запустил workflow.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Устанавливаем Node.js и включаем кеш npm.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Устанавливаем точные версии зависимостей из package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Создаём стандартный production env-файл Vite до проверки сборки.
      - name: Create production environment file
        env:
          PRODUCTION_ENV: ${{ secrets.ENV }}
        run: |
          test -n "$PRODUCTION_ENV"
          printf '%s\n' "$PRODUCTION_ENV" > .env.production
          chmod 600 .env.production

      # Проверяем, что production-сборка завершается без ошибок.
      - name: Build application
        run: npm run build

      # Сохраняем приватный ключ и адрес сервера для SSH-подключений.
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      # Создаём папку деплоя на сервере, если её ещё нет.
      - name: Prepare deploy directory
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          test -n "$DEPLOY_DIR"
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_DIR'"

      # Передаём текущую версию проекта на сервер через rsync.
      - name: Upload project
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='.env' \
            --exclude='.env.*' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/"

      # Отдельно загружаем production env-файл, исключённый из rsync.
      - name: Upload production environment file
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp -i ~/.ssh/id_ed25519 .env.production \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/.env.production"

      # Пересобираем Docker-образ и запускаем приложение на сервере.
      - name: Start application
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_DIR' && docker compose up -d --build --remove-orphans && docker image prune -f && curl --fail http://localhost/"

      # Всегда удаляем временные секретные файлы с машины GitHub Actions.
      - name: Remove temporary SSH key and environment file
        if: always()
        run: |
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
          shred -u .env.production 2>/dev/null || rm -f .env.production
