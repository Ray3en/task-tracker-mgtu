name: Deploy

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    # GitHub создаёт временную виртуальную машину Linux.
    runs-on: ubuntu-latest

    # Secrets берутся из GitHub Environment с именем production.
    environment: production

    steps:
      # Скачиваем текущий commit на машину GitHub Actions.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Устанавливаем Node.js и включаем кеш npm.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Устанавливаем точные версии из package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Проверяем, что production-сборка создаётся без ошибок.
      - name: Build application
        run: npm run build

      # Настраиваем SSH-доступ к серверу для rsync и удалённых команд.
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      # Копируем текущий commit на сервер. Репозиторий и git на сервере не нужны.
      - name: Upload project
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='.env' \
            --exclude='.env.*' \
            ./ "$SERVER_USER@$SERVER_HOST:/var/www/project/"

      # Пересобираем и перезапускаем приложение из загруженных файлов.
      - name: Start application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" \
            'cd /var/www/project && docker compose up -d --build && docker image prune -f && curl --fail http://localhost/'
